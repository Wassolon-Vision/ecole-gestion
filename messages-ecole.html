<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages – Groupe Scolaire Privé Wassolon Fondation</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--brand2:#1e3a8a;--soft:#eef2ff;--me:#1d4ed8;--them:#eef0f5;--bad:#b91c1c;--err:#b91c1c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--me:#2563eb;--them:#1e2a47;--bad:#fca5a5;--err:#fca5a5;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--me:#2563eb;--them:#1e2a47;--bad:#fca5a5;--err:#fca5a5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;padding:18px 24px}
header small{display:block;color:#dbe4ff;font-size:13px}
header h1{margin:0;font-size:22px}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;text-align:center;margin-left:6px}
.dot[hidden]{display:none}
select,input,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;width:100%}
textarea{min-height:90px;resize:vertical}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;width:auto}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g .w{grid-column:1/-1}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.sm{color:var(--muted);font-size:13px}
.an{border-top:1px solid var(--line);padding:14px 0}
.an:first-child{border-top:0}
.an h3{margin:0;font-size:16px}
.an p{margin:6px 0;white-space:pre-wrap}
.bd{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--brand);margin-right:6px}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0;margin-right:14px}
.link.d{color:var(--bad)}
.chat{display:grid;grid-template-columns:300px 1fr;height:min(70vh,560px);overflow:hidden;padding:0}
.cl{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.cl .top{padding:10px;border-bottom:1px solid var(--line)}
.ct{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 12px;cursor:pointer}
.ct:hover,.ct.on{background:var(--soft)}
.ct b{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.ct .p{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.th{display:flex;flex-direction:column;min-width:0}
.th .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.th .hd .back{display:none}
.ms{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bu{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--them);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bu.me{background:var(--me);color:#fff;align-self:flex-end}
.bu i{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:2px}
.snd{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.empty{margin:auto;color:var(--muted);text-align:center;padding:20px}
dialog{border:0;border-radius:14px;padding:0;width:min(420px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:20px}
dialog h2{margin:0 0 4px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:16px}
@media (max-width:700px){
  header{padding:14px 16px}
  .g{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}
  .chat.open .cl{display:none}
  .chat:not(.open) .th{display:none}
  .th .hd .back{display:inline-block}
  .cl{border-right:0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<a href="./" class="np-back" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:50;background:#fff;color:#1d4ed8;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font:600 13px system-ui,sans-serif;text-decoration:none">← Retour au menu</a><style>@media print{.np-back{display:none!important}}</style>
<header><small>Groupe Scolaire Privé Wassolon Fondation, Kankan – 2026-2027</small><h1>Messages</h1></header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="a" aria-selected="true">Annonces</button>
    <button role="tab" data-t="d" aria-selected="false">Discussions <span class="dot" id="dot"></span></button>
  </div>

  <section id="pa">
    <div class="card">
      <div class="g">
        <div><label for="ad">Destinataires</label><select id="ad"><option value="all">Toute l’école</option><option value="cl">Une classe ou un niveau</option><option value="te">Les enseignants seulement</option></select></div>
        <div id="wc" hidden><label for="ac">Classe ou niveau</label><select id="ac"></select></div>
        <div class="w"><label for="at">Titre</label><input id="at" maxlength="80" placeholder="Ex. Réunion des parents"></div>
        <div class="w"><label for="am">Message</label><textarea id="am" placeholder="Écrivez votre annonce…"></textarea></div>
      </div>
      <div class="err" id="ae" role="alert"></div>
      <div class="acts"><button class="btn" id="ap">Publier l’annonce</button></div>
    </div>
    <h2 style="font-size:16px;margin:20px 0 6px">Annonces publiées</h2>
    <div class="card" id="al"></div>
  </section>

  <section id="pd" hidden>
    <div class="card chat" id="chat">
      <div class="cl"><div class="top"><button class="btn" id="nd" style="width:100%">+ Nouvelle discussion</button></div><div id="cs"></div></div>
      <div class="th" id="th"></div>
    </div>
  </section>
  <p class="note">Aperçu avec des données d’exemple : les changements disparaissent à la fermeture de la page. La base de données les gardera à l’étape suivante.</p>
</main>

<dialog id="dlg">
  <form method="dialog" novalidate>
    <h2>Nouvelle discussion</h2>
    <label for="nt">Avec qui ?</label>
    <select id="nt"><option value="P">Un parent</option><option value="E">Un enseignant</option></select>
    <label for="np">Personne</label><select id="np"></select>
    <div class="err" id="ne" role="alert"></div>
    <div class="acts"><button type="button" class="btn sec" id="nc">Annuler</button><button type="button" class="btn" id="ns">Ouvrir la discussion</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2800)}
function now(){return new Date().toISOString()}
function fmt(iso){var d=new Date(iso);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+" à "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function ago(h){return new Date(Date.now()-h*3600000).toISOString()}
var CL=["1e","2e","3e","4e","5e","6e A","6e B","7e A","7e B","8e","9e","10e","11e","12e","Terminale"];
$("ac").innerHTML=CL.map(function(c){return "<option>"+c+"</option>"}).join("");
var PAR=[["Mariam Camara","parent de Camara Fatoumata (1e)"],["Sékou Diakité","parent de Diakité Mamadou (3e)"],["Salif Keïta","parent de Keïta Aïssata (6e A)"],["Naby Traoré","parent de Traoré Ibrahima (7e A)"],["Hawa Sylla","parent de Sylla Kadiatou (9e)"],["Moussa Condé","parent de Condé Alpha (11e)"]];
var ENS=["M. Sidibé","Mme Soumah","M. Konaté","Mme Fofana","M. Cissé","M. Barry","M. Bangoura","Mme Doumbouya"];
var A=[
{t:"Réunion des parents d’élèves",to:"Toute l’école",x:"Une réunion générale aura lieu samedi à 9h dans la cour de l’école. La présence de tous les parents est souhaitée.",d:ago(26)},
{t:"Remise des bulletins du 1er trimestre",to:"Classe : 8e",x:"Les bulletins seront remis aux parents le vendredi de la semaine prochaine, à partir de 15h.",d:ago(70)},
{t:"Conseil des enseignants",to:"Enseignants",x:"Le conseil de classe se tiendra mercredi à 14h en salle des professeurs. Merci d’apporter les notes du trimestre.",d:ago(100)}
];
var C=[
{n:"Mariam Camara",r:"parent de Camara Fatoumata (1e)",u:1,m:[{me:0,d:ago(5),x:"Bonjour, ma fille sera absente demain pour un rendez-vous. Je vous enverrai un justificatif."}]},
{n:"M. Konaté",r:"Enseignant",u:0,m:[{me:1,d:ago(30),x:"Bonjour, pouvez-vous me remettre les notes de composition de la 9e avant jeudi ?"},{me:0,d:ago(28),x:"Bien reçu, je les saisis aujourd’hui."}]},
{n:"Salif Keïta",r:"parent de Keïta Aïssata (6e A)",u:0,m:[{me:1,d:ago(52),x:"Bonjour, nous vous invitons à passer à l’école au sujet des frais du 2e trimestre."},{me:0,d:ago(50),x:"D’accord, je passe lundi matin."}]}
];
var cur=-1;
function dots(){var n=C.reduce(function(a,c){return a+c.u},0);$("dot").textContent=n;$("dot").hidden=!n}
/* Annonces */
$("ad").onchange=function(){$("wc").hidden=this.value!="cl"};
function anList(){
  $("al").innerHTML=A.length?A.map(function(a,i){var tx=a.t+"\n\n"+a.x+"\n\nGroupe Scolaire Privé Wassolon Fondation";
    return '<div class="an"><h3>'+esc(a.t)+'</h3><div class="sm"><span class="bd">'+esc(a.to)+"</span>"+fmt(a.d)+"</div><p>"+esc(a.x)+'</p><a class="link" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(tx)+'">Partager sur WhatsApp</a><button class="link" data-c="'+i+'">Copier le texte</button><button class="link d" data-r="'+i+'">Supprimer</button></div>'
  }).join(""):'<p class="sm">Aucune annonce pour le moment.</p>';
}
$("al").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.c!=null){var a=A[+b.dataset.c],tx=a.t+"\n\n"+a.x;try{navigator.clipboard.writeText(tx).then(function(){toast("Texte copié")},function(){toast("Copie impossible : sélectionnez le texte à la main.")})}catch(x){toast("Copie impossible sur cet appareil.")}}
  if(b.dataset.r!=null){if(b.dataset.s){A.splice(+b.dataset.r,1);anList();toast("Annonce supprimée")}else{b.dataset.s=1;b.textContent="Confirmer la suppression"}}
};
$("ap").onclick=function(){
  var e=$("ae");e.textContent="";var t=$("at").value.trim(),x=$("am").value.trim(),k=$("ad").value;
  if(t.length<3){e.textContent="Écrivez un titre (au moins 3 lettres).";return}
  if(x.length<10){e.textContent="Le message est trop court (au moins 10 lettres).";return}
  A.unshift({t:t,x:x,d:now(),to:k=="all"?"Toute l’école":k=="te"?"Enseignants":"Classe : "+$("ac").value});
  $("at").value="";$("am").value="";anList();toast("Annonce publiée");
};
/* Discussions */
function list(){
  $("cs").innerHTML=C.length?C.map(function(c,i){var l=c.m[c.m.length-1];
    return '<button class="ct'+(i==cur?" on":"")+'" data-i="'+i+'"><b><span>'+esc(c.n)+"</span>"+(c.u?'<span class="dot">'+c.u+"</span>":"")+'</b><span class="p">'+esc(c.r)+'</span><span class="p">'+(l?(l.me?"Vous : ":"")+esc(l.x):"Aucun message")+"</span></button>"
  }).join(""):'<p class="sm" style="padding:12px">Aucune discussion.</p>';
  dots();
}
function thread(){
  if(cur<0){$("th").innerHTML='<div class="empty">Choisissez une discussion ou commencez-en une nouvelle.</div>';return}
  var c=C[cur];
  $("th").innerHTML='<div class="hd"><button class="btn sec back" id="bk" aria-label="Retour à la liste">←</button><div><b>'+esc(c.n)+'</b><div class="sm">'+esc(c.r)+'</div></div></div><div class="ms" id="ms">'+(c.m.length?c.m.map(function(m){return '<div class="bu'+(m.me?" me":"")+'">'+esc(m.x)+"<i>"+fmt(m.d)+"</i></div>"}).join(""):'<div class="empty">Écrivez le premier message.</div>')+'</div><div class="snd"><input id="mi" placeholder="Votre message" aria-label="Votre message"><button class="btn" id="sd">Envoyer</button></div>';
  var ms=$("ms");ms.scrollTop=ms.scrollHeight;
  $("bk").onclick=function(){$("chat").classList.remove("open")};
  $("sd").onclick=send;$("mi").onkeydown=function(e){if(e.key=="Enter")send()};
}
function send(){var v=$("mi").value.trim();if(!v){toast("Écrivez un message avant d’envoyer.");return}C[cur].m.push({me:1,d:now(),x:v});var c=C.splice(cur,1)[0];C.unshift(c);cur=0;list();thread()}
function openC(i){cur=i;C[i].u=0;$("chat").classList.add("open");list();thread()}
$("cs").onclick=function(e){var b=e.target.closest(".ct");if(b)openC(+b.dataset.i)};
function fillP(){var t=$("nt").value;$("np").innerHTML=t=="P"?PAR.map(function(p,i){return '<option value="'+i+'">'+esc(p[0])+" – "+esc(p[1])+"</option>"}).join(""):ENS.map(function(n,i){return '<option value="'+i+'">'+esc(n)+"</option>"}).join("")}
$("nt").onchange=fillP;
$("nd").onclick=function(){fillP();$("ne").textContent="";$("dlg").showModal()};
$("nc").onclick=function(){$("dlg").close()};
$("ns").onclick=function(){
  var t=$("nt").value,i=+$("np").value,n=t=="P"?PAR[i][0]:ENS[i],r=t=="P"?PAR[i][1]:"Enseignant";
  var f=-1;C.forEach(function(c,j){if(c.n==n)f=j});
  if(f<0){C.unshift({n:n,r:r,u:0,m:[]});f=0}
  $("dlg").close();openC(f);
};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){var t=b.dataset.t;$("pa").hidden=t!="a";$("pd").hidden=t!="d";document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x==b)});if(t=="d"){list();thread()}}});
anList();list();thread();
</script>
</body>
</html>
