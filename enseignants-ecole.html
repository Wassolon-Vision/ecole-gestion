<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enseignants – Groupe Scolaire Privé Wassolon Fondation</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--brand2:#1e3a8a;--soft:#eef2ff;--perm:#1e40af;--permbg:#dbeafe;--vac:#b45309;--vacbg:#fef3c7;--err:#b91c1c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--perm:#bfdbfe;--permbg:#1e3a6e;--vac:#fcd34d;--vacbg:#4a3410;--err:#fca5a5;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--perm:#bfdbfe;--permbg:#1e3a6e;--vac:#fcd34d;--vacbg:#4a3410;--err:#fca5a5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;padding:18px 24px}
header small{display:block;color:#dbe4ff;font-size:13px}
header h1{margin:0;font-size:22px}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k span{color:var(--muted);font-size:13px}
.k b{display:block;font-size:24px;line-height:1.3}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:170px}
select,input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:var(--card);color:var(--err);border:1px solid var(--err)}
.count{color:var(--muted);font-size:13px;margin:0 0 10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.r{display:grid;grid-template-columns:1.3fr 1.5fr 1.2fr 1fr;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.r:first-child{border-top:0}
.r:hover{background:var(--soft)}
.r b{display:block}
.sm{color:var(--muted);font-size:13px}
.bd{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.bd.p{background:var(--permbg);color:var(--perm)}.bd.v{background:var(--vacbg);color:var(--vac)}
.empty{padding:26px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(580px,95vw);background:var(--card);color:var(--text);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:20px}
form h2{margin:0 0 4px;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
label.t{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
form input:not([type=checkbox]),form select{width:100%}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.ch label:has(input:checked){background:var(--soft);border-color:var(--brand)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.acts .del{margin-right:auto}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:16px}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.r{grid-template-columns:1fr}.g2{grid-template-columns:1fr}header{padding:14px 16px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<a href="./" class="np-back" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:50;background:#fff;color:#1d4ed8;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font:600 13px system-ui,sans-serif;text-decoration:none">← Retour au menu</a><style>@media print{.np-back{display:none!important}}</style>
<header><small>Groupe Scolaire Privé Wassolon Fondation, Kankan – 2026-2027</small><h1>Enseignants</h1></header>
<main>
  <section class="cards" id="cards"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="Chercher un enseignant" aria-label="Chercher un enseignant">
    <select id="fm" aria-label="Matière"></select>
    <select id="fs" aria-label="Statut"><option value="">Tous les statuts</option><option>Permanent</option><option>Vacataire</option></select>
    <button class="btn" id="add">+ Nouvel enseignant</button>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  <p class="note">Aperçu avec des données d’exemple : les changements disparaissent à la fermeture de la page. La base de données les gardera à l’étape suivante.</p>
</main>

<dialog id="dlg">
  <form id="f" method="dialog" novalidate>
    <h2 id="ft">Nouvel enseignant</h2>
    <div class="g2">
      <div><label class="t" for="pre">Prénom</label><input id="pre" autocomplete="off"></div>
      <div><label class="t" for="nom">Nom</label><input id="nom" autocomplete="off"></div>
      <div><label class="t" for="sx">Sexe</label><select id="sx"><option value="">Choisir</option><option>Homme</option><option>Femme</option></select></div>
      <div><label class="t" for="tel">Téléphone</label><input id="tel" type="tel" inputmode="tel" placeholder="Ex. 620 00 00 00"></div>
    </div>
    <label class="t">Matières enseignées</label><div class="ch" id="mc"></div>
    <label class="t">Classes confiées</label><div class="ch" id="cc"></div>
    <div class="g2">
      <div><label class="t" for="ti">Titulaire de la classe</label><select id="ti"></select></div>
      <div><label class="t" for="st">Statut</label><select id="st"><option>Permanent</option><option>Vacataire</option></select></div>
      <div><label class="t" for="dh">Date d’embauche</label><input id="dh" type="date"></div>
      <div><label class="t" for="dp">Diplôme ou qualification</label><input id="dp" placeholder="Ex. Licence en mathématiques"></div>
    </div>
    <div class="err" id="er" role="alert"></div>
    <div class="acts"><button type="button" class="btn del" id="dl" hidden>Supprimer</button><button type="button" class="btn sec" id="cn">Annuler</button><button type="button" class="btn" id="sv">Enregistrer</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2800)}
var MAT=["Français","Mathématiques","Anglais","Histoire-Géographie","Sciences physiques","SVT","EPS","Éducation civique"];
var CLS=["1e","2e","3e","4e","5e","6e A","6e B","7e A","7e B","8e","9e","10e","11e","12e","Terminale"];
var E=[
{pre:"Ousmane",nom:"Sidibé",sx:"Homme",tel:"620 00 00 02",m:["Mathématiques","Sciences physiques"],c:["8e","9e","10e"],ti:"8e",st:"Permanent",dh:"2019-10-01",dp:"Licence en mathématiques"},
{pre:"Aïssatou",nom:"Soumah",sx:"Femme",tel:"620 00 00 03",m:["Français"],c:["9e","10e","11e"],ti:"9e",st:"Permanent",dh:"2020-10-05",dp:"Licence en lettres modernes"},
{pre:"Lansana",nom:"Konaté",sx:"Homme",tel:"620 00 00 04",m:["Histoire-Géographie","Éducation civique"],c:["6e A","6e B","7e A"],ti:"",st:"Vacataire",dh:"2024-10-07",dp:"Licence en histoire"},
{pre:"Nantenin",nom:"Fofana",sx:"Femme",tel:"620 00 00 05",m:["SVT"],c:["11e","12e","Terminale"],ti:"11e",st:"Permanent",dh:"2021-10-04",dp:"Master en biologie"},
{pre:"Mamadou",nom:"Cissé",sx:"Homme",tel:"620 00 00 06",m:["Anglais"],c:["12e","Terminale","7e B"],ti:"12e",st:"Permanent",dh:"2018-10-01",dp:"Licence en anglais"},
{pre:"Alpha",nom:"Barry",sx:"Homme",tel:"620 00 00 07",m:["EPS"],c:["1e","2e","3e","4e","5e"],ti:"",st:"Vacataire",dh:"2025-10-06",dp:"Brevet de sport"}
];
var today=new Date().toISOString().slice(0,10);
function dfr(d){return d?d.split("-").reverse().join("/"):"–"}
$("fm").innerHTML='<option value="">Toutes les matières</option>'+MAT.map(function(m){return "<option>"+m+"</option>"}).join("");
$("mc").innerHTML=MAT.map(function(m){return '<label><input type="checkbox" name="m" value="'+m+'">'+m+"</label>"}).join("");
$("cc").innerHTML=CLS.map(function(c){return '<label><input type="checkbox" name="c" value="'+c+'">'+c+"</label>"}).join("");
$("ti").innerHTML='<option value="">Aucune</option>'+CLS.map(function(c){return "<option>"+c+"</option>"}).join("");
function cards(){
  var p=E.filter(function(e){return e.st=="Permanent"}).length,t=E.filter(function(e){return e.ti}).length;
  $("cards").innerHTML=[["Enseignants",E.length],["Permanents",p],["Vacataires",E.length-p],["Titulaires de classe",t]].map(function(x){return '<div class="k"><span>'+x[0]+"</span><b>"+x[1]+"</b></div>"}).join("")
}
function list(){
  var q=$("q").value.trim().toLowerCase(),fm=$("fm").value,fs=$("fs").value;
  var r=E.map(function(e,i){e.i=i;return e}).filter(function(e){return (!fm||e.m.indexOf(fm)>-1)&&(!fs||e.st==fs)&&(!q||(e.pre+" "+e.nom).toLowerCase().indexOf(q)>-1)});
  $("count").textContent=r.length+" enseignant"+(r.length>1?"s":"")+" sur "+E.length;
  $("list").innerHTML=r.length?r.map(function(e){
    return '<button class="r" data-i="'+e.i+'"><span><b>'+esc(e.pre+" "+e.nom)+'</b><span class="sm">'+esc(e.tel)+'</span></span><span>'+esc(e.m.join(", "))+'<span class="sm" style="display:block">Classes : '+esc(e.c.join(", ")||"aucune")+'</span></span><span class="sm">'+(e.ti?"Titulaire : "+esc(e.ti):"Pas titulaire")+'<br>Embauché le '+dfr(e.dh)+'</span><span><span class="bd '+(e.st=="Permanent"?"p":"v")+'">'+e.st+"</span></span></button>"
  }).join(""):'<div class="empty">Aucun enseignant trouvé. Changez la recherche ou les filtres.</div>';
}
["q","fm","fs"].forEach(function(k){$(k).oninput=list});
$("list").onclick=function(e){var b=e.target.closest(".r");if(b)openF(+b.dataset.i)};
var cur=-1,sure=false;
function checks(n,vals){document.querySelectorAll('input[name="'+n+'"]').forEach(function(c){c.checked=vals.indexOf(c.value)>-1})}
function getc(n){return Array.prototype.map.call(document.querySelectorAll('input[name="'+n+'"]:checked'),function(c){return c.value})}
function openF(i){
  cur=i;sure=false;var e=i>=0?E[i]:{pre:"",nom:"",sx:"",tel:"",m:[],c:[],ti:"",st:"Permanent",dh:"",dp:""};
  $("ft").textContent=i>=0?"Fiche de "+e.pre+" "+e.nom:"Nouvel enseignant";
  $("pre").value=e.pre;$("nom").value=e.nom;$("sx").value=e.sx;$("tel").value=e.tel;$("ti").value=e.ti;$("st").value=e.st;$("dh").value=e.dh;$("dh").max=today;$("dp").value=e.dp;
  checks("m",e.m);checks("c",e.c);$("er").textContent="";
  $("dl").hidden=i<0;$("dl").textContent="Supprimer";$("dlg").showModal();
}
$("add").onclick=function(){openF(-1)};
$("cn").onclick=function(){$("dlg").close()};
$("dl").onclick=function(){
  if(!sure){sure=true;this.textContent="Confirmer la suppression";return}
  var n=E[cur].pre+" "+E[cur].nom;E.splice(cur,1);$("dlg").close();cards();list();toast(n+" a été supprimé(e)");
};
$("sv").onclick=function(){
  var er=$("er");er.textContent="";
  var v=function(i){return $(i).value.trim()},tel=v("tel").replace(/\s/g,""),m=getc("m"),c=getc("c");
  if(!v("pre")||!v("nom")){er.textContent="Écrivez le prénom et le nom.";return}
  if(!v("sx")){er.textContent="Choisissez le sexe.";return}
  if(!/^\+?\d{8,12}$/.test(tel)){er.textContent="Entrez un numéro de téléphone valide (8 à 12 chiffres).";return}
  for(var i=0;i<E.length;i++){if(i!=cur&&E[i].tel.replace(/\s/g,"")==tel){er.textContent="Ce numéro est déjà utilisé par "+E[i].pre+" "+E[i].nom+".";return}}
  if(!m.length){er.textContent="Choisissez au moins une matière.";return}
  var ti=v("ti");
  if(ti&&c.indexOf(ti)<0){er.textContent="La classe dont il est titulaire doit faire partie de ses classes confiées.";return}
  for(var j=0;j<E.length;j++){if(j!=cur&&ti&&E[j].ti==ti){er.textContent="La classe "+ti+" a déjà pour titulaire "+E[j].pre+" "+E[j].nom+".";return}}
  if(!v("dh")){er.textContent="Indiquez la date d’embauche.";return}
  if(v("dh")>today){er.textContent="La date d’embauche ne peut pas être dans le futur.";return}
  var o={pre:v("pre"),nom:v("nom"),sx:v("sx"),tel:v("tel"),m:m,c:c,ti:ti,st:v("st"),dh:v("dh"),dp:v("dp")};
  if(cur>=0)E[cur]=o;else E.push(o);
  $("dlg").close();cards();list();toast(o.pre+" "+o.nom+(cur>=0?" : fiche mise à jour":" a été ajouté(e)"));
};
cards();list();
</script>
</body>
</html>
