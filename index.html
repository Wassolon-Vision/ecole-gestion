<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">

<title>Gestion de l’école</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--brand2:#1e3a8a;--soft:#eef2ff;--boys:#1d4ed8;--girls:#f59e0b;--err:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--boys:#3b82f6;--girls:#fbbf24;--err:#fca5a5;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:left}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
h1{margin:0 0 4px;font-size:20px}
.sm{color:var(--muted);font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:var(--card);color:var(--err);border:1px solid var(--err)}
.btn.full{width:100%;margin-top:16px}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;margin:14px 0 4px}
.tabs button{border:0;background:none;color:var(--muted);padding:8px;border-radius:7px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
#app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.side .lg{display:flex;gap:10px;align-items:center;font-weight:700;padding:4px 8px 16px;font-size:13px;line-height:1.25}
.side .lg b{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);font-size:13px;flex:none}
.side nav{flex:1;overflow-y:auto}
.side a,.side button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:#e0e7ff;text-decoration:none;font:inherit;font-size:14px;background:none;border:0;cursor:pointer}
.side a:hover,.side button:hover{background:rgba(255,255,255,.1)}
.side a.on{background:#fff;color:var(--brand2);font-weight:600}
.side .me{font-size:12px;color:#c7d2fe;padding:6px 12px}
main{flex:1;min-width:0;padding:26px 30px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.burger{display:none;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.k,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k span{color:var(--muted);font-size:13px}
.k b{display:block;font-size:30px;line-height:1.2}
.panel h3{margin:0 0 10px;font-size:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.row{display:grid;grid-template-columns:74px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.row .t{text-align:right;color:var(--muted)}
.bar{display:flex;height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%}
.bar .g{background:var(--boys)}.bar .f{background:var(--girls)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px}.tools select{width:auto;min-width:130px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:grid;grid-template-columns:1.5fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it b{display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{padding:6px 10px;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,95vw);background:var(--card);color:var(--text);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:20px}.dl h2{margin:0 0 6px;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g2 .w{grid-column:1/-1}
.cred{margin:12px 0;padding:14px;border-radius:10px;background:var(--soft);font-size:15px}
.cred b{font-size:20px;letter-spacing:1px}
.dacts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
@media (max-width:860px){
  .side{position:fixed;z-index:20;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .burger{display:inline-block}
  main{padding:16px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .it{grid-template-columns:1fr auto}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.side,.toast{transition:none}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cc h3{margin:0;font-size:18px}
.pb{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0}
.pb span{display:block;height:100%;background:#15803d}.pb span.w{background:#b45309}.pb span.f{background:var(--err)}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;margin:0;cursor:pointer;font-weight:400}
.ck label:has(input:checked){background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.ck input{width:auto;margin:0}
.tb2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tb2 button{border:0;background:none;color:var(--muted);padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tb2 button[aria-pressed="true"]{color:var(--brand);border-bottom-color:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:13px}
table.t .n{text-align:center}
.gi{width:84px;text-align:center}
.low{color:var(--err)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.res div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.res b{display:block;font-size:20px;color:var(--text)}
@media (max-width:600px){.res{grid-template-columns:1fr}}
@media print{.side,.noprint,.burger{display:none!important}main{padding:0}body{background:#fff;color:#000}.panel{border:0;padding:0}:root{--text:#000;--muted:#444;--line:#999;--soft:#eee;--err:#000}}
.lk{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0 4px}
#rec{display:none}
@media print{.print-rec>:not(#rec){display:none!important}.print-rec #rec{display:block;color:#000;background:#fff;padding:24px;font-family:Georgia,serif}.print-rec #rec table{width:100%;border-collapse:collapse;margin-top:14px}.print-rec #rec td{border:1px solid #999;padding:8px}.print-rec #rec .sg{margin-top:40px;display:flex;justify-content:space-between}}
.ar{display:grid;grid-template-columns:1.2fr 1.5fr 1fr;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.ar:first-child{border-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--muted);padding:8px 6px;font:600 13px inherit;font-family:inherit;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].sgP{background:#dcfce7;color:#15803d}
.seg button[aria-pressed="true"].sgA{background:#fee2e2;color:#b91c1c}
.seg button[aria-pressed="true"].sgR{background:#fef3c7;color:#b45309}
@media (max-width:700px){.ar{grid-template-columns:1fr}}
.ec{display:block;width:100%;min-height:62px;padding:8px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ec:hover{background:var(--soft)}
.ms2{max-height:340px;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:8px}
.bu{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--soft);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bu.me{background:var(--brand);color:#fff;align-self:flex-end}
.bu i{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:2px}
.snd{display:flex;gap:8px;padding:10px 0}.snd input{flex:1}
.chat2{display:grid;grid-template-columns:280px 1fr;gap:14px}
.ct2{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 12px;cursor:pointer}
.ct2:hover,.ct2.on{background:var(--soft)}
.ct2 b{display:block;font-size:14px}
@media (max-width:760px){.chat2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="rec"></div>
<div id="boot" class="center">Chargement…</div>
<div id="auth" class="center" hidden><div class="box" id="abox"></div></div>
<div id="app" hidden>
  <aside class="side" id="side"><div class="lg"><b>GSW</b><span id="sn"></span></div><nav id="nav"></nav><div class="me" id="me"></div><button id="inst" hidden>📲 Installer l’application</button><button id="out">↩️ Déconnexion</button></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dl" id="dl"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
/* ===== Configuration Firebase de votre projet ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBAQpV2a1-SNO9avdQHYX7bS14hT8AIUgQ",
  authDomain: "ecole-web-ae556.firebaseapp.com",
  projectId: "ecole-web-ae556",
  storageBucket: "ecole-web-ae556.firebasestorage.app",
  messagingSenderId: "53849410080",
  appId: "1:53849410080:web:96b2b733608ce833b78a45"
};
/* ===== fin de la configuration ===== */
const QP=new URLSearchParams(location.search);
if(QP.has("demo"))localStorage.setItem("demo-mode","1");
if(QP.has("firebase"))localStorage.removeItem("demo-mode");
const DEMO=String(firebaseConfig.apiKey).startsWith("COLLER")||localStorage.getItem("demo-mode")=="1";
const V10="https://www.gstatic.com/firebasejs/10.12.2/";
const FB=DEMO?demoLib():Object.assign({},await import(V10+"firebase-app.js"),await import(V10+"firebase-auth.js"),await import(V10+"firebase-firestore.js"));
const {initializeApp,deleteApp,getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,getFirestore,doc,getDoc,updateDoc,collection,onSnapshot,runTransaction,serverTimestamp,writeBatch,query,where}=FB;

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOM="@ecole-wassolon.app";
const LV=["1e","2e","3e","4e","5e","6e","7e","8e","9e","10e","11e","12e","Terminale"];
let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000);try{if(me&&me.role!="parent"&&!/[.!?]$/.test(m))logAct(m)}catch(e){}};
const frErr=e=>({"auth/invalid-credential":"Identifiant ou mot de passe incorrect.","auth/wrong-password":"Identifiant ou mot de passe incorrect.","auth/user-not-found":"Identifiant ou mot de passe incorrect.","auth/invalid-email":"Identifiant non valide.","auth/too-many-requests":"Trop d’essais. Attendez quelques minutes.","auth/network-request-failed":"Pas de connexion Internet.","auth/email-already-in-use":"Ce compte existe déjà.","auth/weak-password":"Le mot de passe doit avoir au moins 6 caractères.","permission-denied":"Action non autorisée.","auth/operation-not-allowed":"La connexion par e-mail et mot de passe n’est pas activée dans Firebase."}[e.code]||"Une erreur est survenue ("+(e.code||e.message)+").");

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,school=null,students=[],users=[],classes=[],teachers=[],unsub=[],setting=false,view="",armed="";

/* ---------- identifiants ---------- */
const email=(id,parent)=>{
  if(parent)return String(id).replace(/\s/g,"").toLowerCase()+DOM;
  let d=String(id).replace(/\D/g,"");if(d.startsWith("224")&&d.length>=11)d=d.slice(3);
  return "t"+d+DOM;
};
const genPw=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>c[b%c.length]).join("")};
const genCode=()=>String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
const once=r=>new Promise((res,rej)=>{let u=null,d=false;u=onSnapshot(r,q=>{if(d)return;d=true;try{u&&u()}catch(e){}res(q.docs.map(x=>({id:x.id,...x.data()})))},rej)});
/* installation sur téléphone et ordinateur */
let ip=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;["inst","linst"].forEach(i=>{const b=$(i);if(b)b.hidden=false})});
window.addEventListener("appinstalled",()=>{ip=null;["inst","linst"].forEach(i=>{const b=$(i);if(b)b.hidden=true})});
if("serviceWorker" in navigator&&location.protocol!="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
function installBox(){return standalone?"":'<div class="sm" style="margin-top:14px"><button class="btn sec full" id="linst" style="margin-top:0"'+(ip?"":" hidden")+'>📲 Installer l’application</button>'+(isIos?'<div style="margin-top:8px">Sur iPhone : touchez « Partager », puis « Sur l’écran d’accueil ».</div>':"")+"</div>"}
function bindInstall(){["inst","linst"].forEach(i=>{const b=$(i);if(b)b.onclick=async()=>{if(!ip)return;ip.prompt();try{await ip.userChoice}catch(e){}ip=null;b.hidden=true}})}
window.addEventListener("afterprint",()=>document.body.classList.remove("print-rec"));
async function mkUser(mail,pass){
  const a=initializeApp(firebaseConfig,"s"+Date.now());
  try{return (await createUserWithEmailAndPassword(getAuth(a),mail,pass)).user.uid}finally{await deleteApp(a)}
}

/* ---------- démarrage ---------- */
async function start(){
  try{const s=await getDoc(doc(db,"config","ecole"));school=s.exists()?s.data():null;if(school)applyColor()}
  catch(e){$("boot").textContent="Impossible de joindre la base de données. Vérifiez la connexion et publiez les règles Firestore.";return}
  onAuthStateChanged(auth,u=>{if(setting)return;u?boot(u):showAuth()});
}
function showAuth(msg){
  unsub.forEach(f=>f());unsub=[];me=null;students=[];users=[];
  $("boot").hidden=true;$("app").hidden=true;$("auth").hidden=false;
  school?loginForm(msg):setupForm();
}
function loginForm(msg,parent){
  $("abox").innerHTML=`<div class="logo">${school.logo?`<img src="${school.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:"GSW"}</div><h1>${esc(school.nom)}</h1><div class="sm">Connexion</div>
  <div class="tabs" role="tablist"><button id="tp" aria-selected="${!!parent}">Parent ou élève</button><button id="ts" aria-selected="${!parent}">Personnel</button></div>
  <label for="i1">${parent?"Matricule de l’élève":"Numéro de téléphone"}</label><input id="i1" ${parent?'placeholder="WSF-2026-0001" autocapitalize="characters"':'type="tel" inputmode="tel" placeholder="620 00 00 00"'} autocomplete="username">
  <label for="i2">${parent?"Code":"Mot de passe"}</label><input id="i2" type="password" autocomplete="current-password">
  <div class="err" id="ae" role="alert">${esc(msg||"")}</div><button class="btn full" id="go">Se connecter</button><div class="sm" style="margin-top:10px;text-align:center">${DEMO?"Mode démonstration : données d’essai, gardées seulement sur cet appareil.":"Connexion à la base de données réelle de l’école."}</div>${DEMO?demoBox():""}${installBox()}`;if(DEMO)bindDemo();bindInstall();
  $("tp").onclick=()=>loginForm("",true);$("ts").onclick=()=>loginForm("",false);
  const go=async()=>{
    const a=$("i1").value.trim(),p=$("i2").value;
    if(!a||!p){$("ae").textContent="Remplissez les deux champs.";return}
    $("go").disabled=true;$("ae").textContent="";
    try{await signInWithEmailAndPassword(auth,email(a,parent),p)}
    catch(e){$("ae").textContent=frErr(e)+(["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(e.code)?(parent?" Écrivez le matricule avec ses tirets (WSF-2026-0001) et le code à 6 chiffres remis par l’école.":" Écrivez le numéro de téléphone donné à l’école (pas votre nom) et le mot de passe."):"");$("go").disabled=false}
  };
  $("go").onclick=go;$("i2").onkeydown=e=>{if(e.key=="Enter")go()};
}
function setupForm(msg){
  $("abox").innerHTML=`<div class="logo">GSW</div><h1>Première utilisation</h1><div class="sm">Créez l’école et le compte de la direction. Faites-le tout de suite après la mise en ligne.</div>
  <label for="s1">Nom de l’école</label><input id="s1" value="Groupe Scolaire Privé Wassolon Fondation">
  <label for="s2">Nom du directeur ou de la directrice</label><input id="s2" autocomplete="name">
  <label for="s3">Numéro de téléphone (votre identifiant)</label><input id="s3" type="tel" inputmode="tel" placeholder="620 00 00 00">
  <label for="s4">Mot de passe (6 caractères au moins)</label><input id="s4" type="password" autocomplete="new-password">
  <div class="err" id="ae" role="alert">${esc(msg||"")}</div><button class="btn full" id="go">Créer l’école</button>${DEMO?demoBox():""}`;if(DEMO)bindDemo();
  $("go").onclick=async()=>{
    const n=$("s1").value.trim(),d=$("s2").value.trim(),t=$("s3").value,p=$("s4").value,e=$("ae");e.textContent="";
    if(!n||!d){e.textContent="Écrivez le nom de l’école et le nom de la direction.";return}
    if(t.replace(/\D/g,"").length<8){e.textContent="Entrez un numéro de téléphone valide.";return}
    if(p.length<6){e.textContent="Le mot de passe doit avoir au moins 6 caractères.";return}
    $("go").disabled=true;setting=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,email(t),p);
      const b=writeBatch(db);
      b.set(doc(db,"users",c.user.uid),{nom:d,role:"direction",actif:true,identifiant:t});
      b.set(doc(db,"config","ecole"),{nom:n,annee:"2026-2027",niveaux:LV,cree:serverTimestamp()});
      await b.commit();
      school={nom:n,annee:"2026-2027",niveaux:LV};setting=false;boot(c.user);
    }catch(x){setting=false;$("go").disabled=false;e.textContent=frErr(x)}
  };
}

async function boot(u){
  let s;
  try{s=await getDoc(doc(db,"users",u.uid))}catch(e){await signOut(auth);showAuth(frErr(e));return}
  if(!s.exists()||s.data().actif===false){const m=s.exists()?"Ce compte est désactivé. Contactez la direction.":"Ce compte n’a pas de profil. Contactez la direction.";await signOut(auth);showAuth(m);return}
  me={uid:u.uid,...s.data()};

function thHtml(th,viewer){
  const ms=(th&&th.m)||[];
  return `<div class="ms2" id="msb">${ms.length?ms.map(m=>{const mine=(m.de=="dir")==(viewer=="dir");return `<div class="bu${mine?" me":""}">${esc(m.x)}<i>${esc(m.par||"")} – ${fmtT(m.d)}</i></div>`}).join(""):'<div class="empty">Aucun message. Écrivez le premier.</div>'}</div><div class="snd"><input id="mi" placeholder="Votre message" aria-label="Votre message"><button class="btn" data-a="msend">Envoyer</button></div>`;

async function sendMsg(uid,name,role,text,fromDir){
  await runTransaction(db,async t=>{
    const r=doc(db,"threads",uid),sn=await t.get(r),cur=sn.exists()?sn.data():{name,role,m:[]},now=new Date().toISOString();
    t.set(r,{...cur,name,role,m:[...(cur.m||[]),{de:fromDir?"dir":"p",par:me.nom,x:text,d:now}],last:now,nlDir:!fromDir,nlP:!!fromDir});
  });
}
async function renderMyThread(id){
  myBox=id;const box=$(id);if(!box)return;

    const sn=await getDoc(doc(db,"threads",me.uid));myTh=sn.exists()?{id:sn.id,...sn.data()}:null;

let edt={},ets="",ett="g";
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const HOR=()=>school.horaires||[{t:"c",a:"07:30",b:"08:25"},{t:"c",a:"08:25",b:"09:20"},{t:"c",a:"09:20",b:"10:15"},{t:"p",l:"Récréation",a:"10:15",b:"10:35"},{t:"c",a:"10:35",b:"11:30"},{t:"c",a:"11:30",b:"12:25"},{t:"c",a:"12:25",b:"13:20"}];

function ecForm(key){
  const [d,n]=key.split("_").map(Number),c=classes.find(x=>x.id==ets),cells=(edt[ets]&&edt[ets].cells)||{},v=cells[key]||{},h=HOR().filter(x=>x.t=="c")[n-1];

async function paAction(a,b){
  const id=b.dataset.id,k=b.dataset.k,v=i=>$(i).value.trim();
  if(a=="patab"){pat=b.dataset.t;return V.pa()}
  if(a=="pas"){
    const e=$("pe1");e.textContent="";const m=v("p4");
    if(!v("p1")){e.textContent="Écrivez le nom de l’école.";return}
    if(m&&!/^\S+@\S+\.\S+$/.test(m)){e.textContent="L’adresse e-mail n’est pas valide.";return}
    if(v("p3")&&v("p3").replace(/\D/g,"").length<8){e.textContent="Le numéro de téléphone n’est pas valide.";return}
    if(await saveCfg({nom:v("p1"),adresse:v("p2"),tel:v("p3"),mail:m,dir:v("p5")},"Informations de l’école enregistrées")){$("sn").textContent=school.nom+(DEMO?" (démo)":"")}
    return}
  if(a=="paa"){
    const e=$("pe1");e.textContent="";
    if(!v("y0")){e.textContent="Écrivez le nom de l’année.";return}
    const ids=["y1","t0a","t0b","t1a","t1b","t2a","t2b","y2"];
    if(ids.some(i=>!$(i).value)){e.textContent="Remplissez toutes les dates.";return}
    for(let i=1;i<ids.length;i++){if($(ids[i]).value<$(ids[i-1]).value&&i>1){e.textContent="Les dates doivent se suivre dans l’ordre : chaque trimestre commence après la fin du précédent.";return}}
    if($("t0a").value<$("y1").value||$("t2b").value>$("y2").value){e.textContent="Les trimestres doivent être compris entre la rentrée et la fin de l’année.";return}
    for(let i=0;i<3;i++)if($("t"+i+"b").value<$("t"+i+"a").value){e.textContent="La fin du "+["1er","2e","3e"][i]+" trimestre est avant son début.";return}
    return saveCfg({annee:v("y0"),trim:{a:$("y1").value,b:$("y2").value,t:[0,1,2].map(i=>[$("t"+i+"a").value,$("t"+i+"b").value])}},"Année scolaire enregistrée")}
  if(a=="pac"){if(await saveCfg({couleur:+id},"Couleur "+COUL[+id][0].toLowerCase()+" appliquée")){applyColor();V.pa()}return}
  if(a=="pla"){
    const t=v("pl-"+k),L=LISTS().find(x=>x[0]==k)[2];
    if(!t){toast("Écrivez le texte à ajouter.");return}
    if(L.some(x=>x.toLowerCase()==t.toLowerCase())){toast("Ce choix existe déjà.");return}
    if(await saveCfg({[k]:[...L,t]},"Liste « "+LISTS().find(x=>x[0]==k)[1]+" » : "+t+" ajouté"))V.pa();return}
  if(a=="plr"){
    const L=LISTS().find(x=>x[0]==k)[2];
    if(L.length<=1){toast("Gardez au moins un choix : impossible de vider la liste.");return}
    const t=L[+id];if(await saveCfg({[k]:L.filter((x,i)=>i!=+id)},"Liste « "+LISTS().find(x=>x[0]==k)[1]+" » : "+t+" retiré"))V.pa()}
}

let payments=[],curPay="",frtab="p",fq="",fl="",fst="";
const DEFT={ins:100000,t:{"1e":300000,"2e":300000,"3e":300000,"4e":300000,"5e":300000,"6e":300000,"7e":400000,"8e":400000,"9e":400000,"10e":500000,"11e":500000,"12e":500000,"Terminale":550000}};
const tarifs=()=>school.tarifs||DEFT;
const gnf=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" GNF";
const dfr=d=>d?String(d).split("-").reverse().join("/"):"";
const slices=s=>{const T=tarifs(),t=(T.t||{})[s.niveau]||0;return [["Inscription",T.ins||0],["1er trimestre",t],["2e trimestre",t],["3e trimestre",t]]};
const calcF=(s,pay)=>{const paid=pay.reduce((a,x)=>a+x.montant,0);let pool=paid,due=0;const rows=slices(s).map(x=>{const p=Math.min(x[1],pool);pool-=p;due+=x[1];return {n:x[0],d:x[1],p,r:x[1]-p}});return {rows,due,paid,left:due-paid}};
const payOf=id=>payments.filter(x=>x.eleveId==id).sort((a,b)=>a.date.localeCompare(b.date));
const bdg=r=>{const c=r.p>=r.d?"#15803d":r.p>0?"#b45309":"#b91c1c",l=r.n=="Inscription"?"Ins.":r.n[0]=="1"?"T1":r.n[0]=="2"?"T2":"T3";return `<span style="display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:4px;color:#fff;background:${c}" title="${r.n}">${l}</span>`};
V.fr=()=>{
  const lv=school.niveaux||LV;
  let due=0,paid=0;students.forEach(s=>{const c=calcF(s,payOf(s.id));due+=c.due;paid+=c.paid});
  let body="";
  if(frtab=="t"){
    const T=tarifs();
    body=`<p class="sm">Modifiez les montants : tout se recalcule. Les paiements déjà reçus ne changent pas.</p><label for="tins" style="display:block;font-weight:600;font-size:13px;margin:8px 0 4px">Frais d’inscription (une fois par an)</label><input id="tins" inputmode="numeric" value="${T.ins||0}" style="max-width:200px"><table class="t" style="margin-top:12px"><thead><tr><th>Niveau</th><th class="n">Par trimestre (GNF)</th><th class="n">Total année</th></tr></thead><tbody>${lv.map(l=>`<tr><td>${l}</td><td class="n"><input class="gi" style="width:130px;text-align:right" inputmode="numeric" data-tl="${l}" value="${(T.t||{})[l]||0}" aria-label="Montant par trimestre pour ${l}"></td><td class="n">${gnf((T.ins||0)+3*((T.t||{})[l]||0))}</td></tr>`).join("")}</tbody></table>`;
  }else{
