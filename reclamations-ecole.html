<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réclamations – Groupe Scolaire Privé Wassolon Fondation</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--brand2:#1e3a8a;--soft:#eef2ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--gray:#4b5563;--graybg:#e5e7eb;--err:#b91c1c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--ok:#86efac;--okbg:#14391f;--bad:#fca5a5;--badbg:#451a1a;--warn:#fcd34d;--warnbg:#4a3410;--gray:#cbd5e1;--graybg:#334155;--err:#fca5a5;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--ok:#86efac;--okbg:#14391f;--bad:#fca5a5;--badbg:#451a1a;--warn:#fcd34d;--warnbg:#4a3410;--gray:#cbd5e1;--graybg:#334155;--err:#fca5a5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;padding:18px 24px}
header small{display:block;color:#dbe4ff;font-size:13px}
header h1{margin:0;font-size:22px}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.k[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.k span{color:var(--muted);font-size:13px}
.k b{display:block;font-size:24px;line-height:1.3}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:170px}
select,input,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.count{color:var(--muted);font-size:13px;margin:0 0 10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.r{display:grid;grid-template-columns:88px 1.2fr 1.8fr 1fr;gap:12px;align-items:start;padding:12px 16px;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.r:first-child{border-top:0}
.r:hover{background:var(--soft)}
.r b{display:block}
.sm{color:var(--muted);font-size:13px}
.bd{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin:0 4px 2px 0}
.bd.n{background:var(--badbg);color:var(--bad)}.bd.c{background:var(--warnbg);color:var(--warn)}.bd.s{background:var(--okbg);color:var(--ok)}.bd.x{background:var(--graybg);color:var(--gray)}.bd.t{background:var(--soft);color:var(--brand)}
.late{color:var(--bad);font-weight:600;font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(580px,95vw);background:var(--card);color:var(--text);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:20px}
.dl h2{margin:0 0 4px;font-size:18px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g .w{grid-column:1/-1}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.g select,.g input,.g textarea{width:100%}
textarea{min-height:80px;resize:vertical}
.msg{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;white-space:pre-wrap}
.hist{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.hist li{padding:3px 0;border-top:1px solid var(--line)}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .sp{flex:1}
.link{color:var(--brand);text-decoration:underline;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:16px}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.r{grid-template-columns:1fr}.g{grid-template-columns:1fr}header{padding:14px 16px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<a href="./" class="np-back" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:50;background:#fff;color:#1d4ed8;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font:600 13px system-ui,sans-serif;text-decoration:none">← Retour au menu</a><style>@media print{.np-back{display:none!important}}</style>
<header><small>Groupe Scolaire Privé Wassolon Fondation, Kankan – 2026-2027</small><h1>Réclamations</h1></header>
<main>
  <section class="cards" id="cards"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="Chercher un élève ou un mot" aria-label="Chercher">
    <select id="fs" aria-label="Sujet"></select>
    <button class="btn" id="add">+ Nouvelle réclamation</button>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  <p class="note">Aperçu avec des données d’exemple : les changements disparaissent à la fermeture de la page. La base de données les gardera à l’étape suivante.</p>
</main>
<dialog id="dlg"><div class="dl" id="dl"></div></dialog>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2800)}
var today=new Date().toISOString().slice(0,10);
function dfr(d){return d.split("-").reverse().join("/")}
function days(d){return Math.floor((new Date(today+"T00:00:00Z")-new Date(d+"T00:00:00Z"))/86400000)}
function ago(n){var x=new Date(today+"T00:00:00Z");x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)}
var ST=["Nouvelle","En cours","Résolue","Rejetée"],SC={"Nouvelle":"n","En cours":"c","Résolue":"s","Rejetée":"x"};
var SUJ=["Notes ou bulletin","Frais de scolarité ou paiement","Sanction ou discipline","Absence ou emploi du temps","Autre"];
var EL=[["Camara Fatoumata","1e","621 11 22 33"],["Diakité Mamadou","3e","622 44 55 66"],["Keïta Aïssata","6e A","621 77 88 99"],["Traoré Ibrahima","7e A","628 10 20 30"],["Sylla Kadiatou","9e","664 12 34 56"],["Condé Alpha","11e","655 98 76 54"],["Bangoura Mariama","12e","666 33 22 11"],["Touré Sory","Terminale","620 55 44 33"]];
function R(e,d,p,s,x,st,rep,h){return {e:e,d:d,p:p,s:s,x:x,st:st,rep:rep||"",h:h||[[d,"Réclamation enregistrée"]]}}
var D=[
R(2,ago(1),"Parent","Notes ou bulletin","La note de composition en mathématiques semble erronée : ma fille pense avoir mieux réussi.","Nouvelle"),
R(4,ago(2),"Parent","Frais de scolarité ou paiement","Un paiement de 300 000 GNF a été fait en espèces mais il n’apparaît pas dans le solde.","Nouvelle"),
R(3,ago(9),"Élève","Absence ou emploi du temps","Mon absence du mardi était justifiée par un certificat, mais elle est notée non justifiée.","En cours","",[[ago(9),"Réclamation enregistrée"],[ago(7),"Statut : Nouvelle → En cours"]]),
R(1,ago(12),"Parent","Sanction ou discipline","Mon fils conteste la retenue donnée mercredi : il dit ne pas avoir participé au chahut.","Résolue","Après vérification avec l’enseignant, la retenue a été ramenée à 1 heure.",[[ago(12),"Réclamation enregistrée"],[ago(10),"Statut : Nouvelle → En cours"],[ago(8),"Réponse enregistrée"],[ago(8),"Statut : En cours → Résolue"]]),
R(6,ago(20),"Parent","Notes ou bulletin","Demande de revoir la moyenne générale du 1er trimestre.","Rejetée","Le calcul a été vérifié : la moyenne est correcte selon les notes saisies.",[[ago(20),"Réclamation enregistrée"],[ago(18),"Réponse enregistrée"],[ago(18),"Statut : Nouvelle → Rejetée"]])
];
$("fs").innerHTML='<option value="">Tous les sujets</option>'+SUJ.map(function(s){return "<option>"+s+"</option>"}).join("");
var fst="";
function late(r){return (r.st=="Nouvelle"||r.st=="En cours")&&days(r.d)>7}
function render(){
  $("cards").innerHTML=ST.map(function(s){var n=D.filter(function(r){return r.st==s}).length;return '<button class="k" data-s="'+s+'" aria-pressed="'+(fst==s)+'"><span>'+s+(s=="Nouvelle"&&n>1?"s":s=="Résolue"||s=="Rejetée"?(n>1?"s":""):"")+"</span><b>"+n+"</b></button>"}).join("");
  var q=$("q").value.trim().toLowerCase(),fs=$("fs").value;
  var l=D.map(function(r,i){r.i=i;return r}).filter(function(r){return (!fst||r.st==fst)&&(!fs||r.s==fs)&&(!q||(EL[r.e][0]+" "+r.x).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.d.localeCompare(a.d)});
  $("count").textContent=l.length+" réclamation"+(l.length>1?"s":"")+" sur "+D.length+(fst?" (filtre : "+fst.toLowerCase()+")":"");
  $("list").innerHTML=l.length?l.map(function(r){
    return '<button class="r" data-i="'+r.i+'"><span class="sm">'+dfr(r.d)+'</span><span><b>'+esc(EL[r.e][0])+'</b><span class="sm">Classe '+esc(EL[r.e][1])+" – "+r.p+'</span></span><span><span class="bd t">'+esc(r.s)+'</span><br><span class="sm">'+esc(r.x.length>90?r.x.slice(0,90)+"…":r.x)+'</span></span><span><span class="bd '+SC[r.st]+'">'+r.st+"</span>"+(late(r)?'<br><span class="late">En attente depuis '+days(r.d)+" jours</span>":"")+"</span></button>"
  }).join(""):'<div class="empty">Aucune réclamation ne correspond. Changez les filtres.</div>';
}
$("cards").onclick=function(e){var b=e.target.closest(".k");if(!b)return;fst=fst==b.dataset.s?"":b.dataset.s;render()};
$("q").oninput=render;$("fs").oninput=render;
var cur=-1,sure=false;
$("list").onclick=function(e){var b=e.target.closest(".r");if(b)detail(+b.dataset.i)};
function detail(i){
  cur=i;sure=false;var r=D[i],e=EL[r.e];
  $("dl").innerHTML='<h2>'+esc(e[0])+'</h2><div class="sm">Classe '+esc(e[1])+" – déposée par "+(r.p=="Parent"?"le parent":"l’élève")+" le "+dfr(r.d)+'</div><p style="margin:8px 0 0"><span class="bd t">'+esc(r.s)+'</span><span class="bd '+SC[r.st]+'">'+r.st+"</span></p><div class=\"msg\">"+esc(r.x)+'</div>'
  +'<div class="g"><div><label for="st">Statut</label><select id="st">'+ST.map(function(s){return "<option"+(s==r.st?" selected":"")+">"+s+"</option>"}).join("")+'</select></div><div></div><div class="w"><label for="rp">Réponse de la direction</label><textarea id="rp" placeholder="Expliquez la décision prise…">'+esc(r.rep)+'</textarea></div></div>'
  +'<ul class="hist">'+r.h.map(function(h){return "<li>"+dfr(h[0])+" – "+esc(h[1])+"</li>"}).join("")+'</ul><div class="err" id="er" role="alert"></div>'
  +'<div class="acts"><button class="btn del" id="rm">Supprimer</button><span class="sp"></span>'+(r.rep?'<a class="link" id="sms" href="sms:+224'+e[2].replace(/\s/g,"")+"?body="+encodeURIComponent("Réponse à votre réclamation – Groupe Scolaire Privé Wassolon Fondation : "+r.rep)+'">Envoyer la réponse par SMS</a>':"")+'<button class="btn sec" id="cl">Fermer</button><button class="btn" id="sv">Enregistrer</button></div>';
  $("cl").onclick=function(){$("dlg").close()};
  $("rm").onclick=function(){if(!sure){sure=true;this.textContent="Confirmer la suppression";return}D.splice(cur,1);$("dlg").close();render();toast("Réclamation supprimée")};
  $("sv").onclick=saveD;
  $("dlg").showModal();
}
function saveD(){
  var r=D[cur],st=$("st").value,rp=$("rp").value.trim(),er=$("er");er.textContent="";
  if((st=="Résolue"||st=="Rejetée")&&rp.length<5){er.textContent="Écrivez une réponse avant de marquer la réclamation comme "+st.toLowerCase()+".";return}
  var ch=false;
  if(st!=r.st){r.h.push([today,"Statut : "+r.st+" → "+st]);r.st=st;ch=true}
  if(rp!=r.rep){r.rep=rp;r.h.push([today,"Réponse enregistrée"]);ch=true}
  $("dlg").close();render();toast(ch?"Réclamation mise à jour":"Aucun changement");
};
$("add").onclick=function(){
  $("dl").innerHTML='<h2>Nouvelle réclamation</h2><div class="g"><div class="w"><label for="ne">Élève concerné</label><select id="ne"><option value="">Choisir</option>'+EL.map(function(e,i){return '<option value="'+i+'">'+esc(e[0])+" ("+e[1]+")</option>"}).join("")+'</select></div><div><label for="np">Déposée par</label><select id="np"><option>Parent</option><option>Élève</option></select></div><div><label for="ns">Sujet</label><select id="ns">'+SUJ.map(function(s){return "<option>"+s+"</option>"}).join("")+'</select></div><div class="w"><label for="nd">Date</label><input id="nd" type="date" max="'+today+'" value="'+today+'"></div><div class="w"><label for="nx">Description</label><textarea id="nx" placeholder="Que demande la personne ?"></textarea></div></div><div class="err" id="er" role="alert"></div><div class="acts"><button class="btn sec" id="cn">Annuler</button><button class="btn" id="ns2">Enregistrer</button></div>';
  $("cn").onclick=function(){$("dlg").close()};
  $("ns2").onclick=function(){
    var er=$("er");er.textContent="";var e=$("ne").value,d=$("nd").value,x=$("nx").value.trim();
    if(e===""){er.textContent="Choisissez l’élève concerné.";return}
    if(!d||d>today){er.textContent="Choisissez une date qui n’est pas dans le futur.";return}
    if(x.length<10){er.textContent="Décrivez la réclamation (au moins 10 lettres).";return}
    D.push(R(+e,d,$("np").value,$("ns").value,x,"Nouvelle"));$("dlg").close();render();toast("Réclamation enregistrée");
  };
  $("dlg").showModal();
};
render();
</script>
</body>
</html>
