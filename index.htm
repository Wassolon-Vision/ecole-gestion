<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion de l’école</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--brand2:#1e3a8a;--soft:#eef2ff;--boys:#1d4ed8;--girls:#f59e0b;--err:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172036;--text:#f1f5f9;--muted:#94a3b8;--line:#263353;--brand:#3b82f6;--brand2:#172554;--soft:#1e2a47;--boys:#3b82f6;--girls:#fbbf24;--err:#fca5a5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:left}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
h1{margin:0 0 4px;font-size:20px}
.sm{color:var(--muted);font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:var(--card);color:var(--err);border:1px solid var(--err)}
.btn.full{width:100%;margin-top:16px}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;margin:14px 0 4px}
.tabs button{border:0;background:none;color:var(--muted);padding:8px;border-radius:7px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
#app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.side .lg{display:flex;gap:10px;align-items:center;font-weight:700;padding:4px 8px 16px;font-size:13px;line-height:1.25}
.side .lg b{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);font-size:13px;flex:none}
.side nav{flex:1}
.side a,.side button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:#e0e7ff;text-decoration:none;font:inherit;font-size:14px;background:none;border:0;cursor:pointer}
.side a:hover,.side button:hover{background:rgba(255,255,255,.1)}
.side a.on{background:#fff;color:var(--brand2);font-weight:600}
.side .me{font-size:12px;color:#c7d2fe;padding:6px 12px}
main{flex:1;min-width:0;padding:26px 30px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.burger{display:none;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.k,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k span{color:var(--muted);font-size:13px}
.k b{display:block;font-size:30px;line-height:1.2}
.panel h3{margin:0 0 10px;font-size:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.row{display:grid;grid-template-columns:74px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.row .t{text-align:right;color:var(--muted)}
.bar{display:flex;height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%}
.bar .g{background:var(--boys)}.bar .f{background:var(--girls)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px}.tools select{width:auto;min-width:130px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:grid;grid-template-columns:1.5fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it b{display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{padding:6px 10px;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,95vw);background:var(--card);color:var(--text);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:20px}.dl h2{margin:0 0 6px;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g2 .w{grid-column:1/-1}
.cred{margin:12px 0;padding:14px;border-radius:10px;background:var(--soft);font-size:15px}
.cred b{font-size:20px;letter-spacing:1px}
.dacts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
@media (max-width:860px){
  .side{position:fixed;z-index:20;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .burger{display:inline-block}
  main{padding:16px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .it{grid-template-columns:1fr auto}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.side,.toast{transition:none}}
</style>
</head>
<body>
<div id="boot" class="center">Chargement…</div>
<div id="auth" class="center" hidden><div class="box" id="abox"></div></div>
<div id="app" hidden>
  <aside class="side" id="side"><div class="lg"><b>GSW</b><span id="sn"></span></div><nav id="nav"></nav><div class="me" id="me"></div><button id="out">↩️ Déconnexion</button></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dl" id="dl"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,updateDoc,collection,onSnapshot,runTransaction,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* ===== COLLEZ ICI les valeurs de votre firebaseConfig (remplacez chaque COLLER_ICI, gardez les guillemets) ===== */
const firebaseConfig = {
  apiKey: "COLLER_ICI",
  authDomain: "COLLER_ICI",
  projectId: "COLLER_ICI",
  storageBucket: "COLLER_ICI",
  messagingSenderId: "COLLER_ICI",
  appId: "COLLER_ICI"
};
/* ===== fin des valeurs à remplacer ===== */

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOM="@ecole-wassolon.app";
const LV=["1e","2e","3e","4e","5e","6e","7e","8e","9e","10e","11e","12e","Terminale"];
let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)};
const frErr=e=>({"auth/invalid-credential":"Identifiant ou mot de passe incorrect.","auth/wrong-password":"Identifiant ou mot de passe incorrect.","auth/user-not-found":"Identifiant ou mot de passe incorrect.","auth/invalid-email":"Identifiant non valide.","auth/too-many-requests":"Trop d’essais. Attendez quelques minutes.","auth/network-request-failed":"Pas de connexion Internet.","auth/email-already-in-use":"Ce compte existe déjà.","auth/weak-password":"Le mot de passe doit avoir au moins 6 caractères.","permission-denied":"Action non autorisée.","auth/operation-not-allowed":"La connexion par e-mail et mot de passe n’est pas activée dans Firebase."}[e.code]||"Une erreur est survenue ("+(e.code||e.message)+").");

if(String(firebaseConfig.apiKey).startsWith("COLLER")){
  $("boot").innerHTML="<div><b>Configuration manquante</b><br>Ouvrez <code>index.html</code> sur GitHub (icône crayon) et remplacez chaque COLLER_ICI par les valeurs de votre firebaseConfig.</div>";
  throw new Error("config");
}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,school=null,students=[],users=[],unsub=[],setting=false,view="",armed="";

/* ---------- identifiants ---------- */
const email=(id,parent)=>{
  if(parent)return String(id).replace(/\s/g,"").toLowerCase()+DOM;
  let d=String(id).replace(/\D/g,"");if(d.startsWith("224")&&d.length>=11)d=d.slice(3);
  return "t"+d+DOM;
};
const genPw=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>c[b%c.length]).join("")};
const genCode=()=>String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
async function mkUser(mail,pass){
  const a=initializeApp(firebaseConfig,"s"+Date.now());
  try{return (await createUserWithEmailAndPassword(getAuth(a),mail,pass)).user.uid}finally{await deleteApp(a)}
}

/* ---------- démarrage ---------- */
async function start(){
  try{const s=await getDoc(doc(db,"config","ecole"));school=s.exists()?s.data():null}
  catch(e){$("boot").textContent="Impossible de joindre la base de données. Vérifiez la connexion et publiez les règles Firestore.";return}
  onAuthStateChanged(auth,u=>{if(setting)return;u?boot(u):showAuth()});
}
function showAuth(msg){
  unsub.forEach(f=>f());unsub=[];me=null;students=[];users=[];
  $("boot").hidden=true;$("app").hidden=true;$("auth").hidden=false;
  school?loginForm(msg):setupForm();
}
function loginForm(msg,parent){
  $("abox").innerHTML=`<div class="logo">GSW</div><h1>${esc(school.nom)}</h1><div class="sm">Connexion</div>
  <div class="tabs" role="tablist"><button id="tp" aria-selected="${!!parent}">Parent ou élève</button><button id="ts" aria-selected="${!parent}">Personnel</button></div>
  <label for="i1">${parent?"Matricule de l’élève":"Numéro de téléphone"}</label><input id="i1" ${parent?'placeholder="WSF-2026-0001" autocapitalize="characters"':'type="tel" inputmode="tel" placeholder="620 00 00 00"'} autocomplete="username">
  <label for="i2">${parent?"Code":"Mot de passe"}</label><input id="i2" type="password" autocomplete="current-password">
  <div class="err" id="ae" role="alert">${esc(msg||"")}</div><button class="btn full" id="go">Se connecter</button>`;
  $("tp").onclick=()=>loginForm("",true);$("ts").onclick=()=>loginForm("",false);
  const go=async()=>{
    const a=$("i1").value.trim(),p=$("i2").value;
    if(!a||!p){$("ae").textContent="Remplissez les deux champs.";return}
    $("go").disabled=true;$("ae").textContent="";
    try{await signInWithEmailAndPassword(auth,email(a,parent),p)}
    catch(e){$("ae").textContent=frErr(e);$("go").disabled=false}
  };
  $("go").onclick=go;$("i2").onkeydown=e=>{if(e.key=="Enter")go()};
}
function setupForm(msg){
  $("abox").innerHTML=`<div class="logo">GSW</div><h1>Première utilisation</h1><div class="sm">Créez l’école et le compte de la direction. Faites-le tout de suite après la mise en ligne.</div>
  <label for="s1">Nom de l’école</label><input id="s1" value="Groupe Scolaire Privé Wassolon Fondation">
  <label for="s2">Nom du directeur ou de la directrice</label><input id="s2" autocomplete="name">
  <label for="s3">Numéro de téléphone (votre identifiant)</label><input id="s3" type="tel" inputmode="tel" placeholder="620 00 00 00">
  <label for="s4">Mot de passe (6 caractères au moins)</label><input id="s4" type="password" autocomplete="new-password">
  <div class="err" id="ae" role="alert">${esc(msg||"")}</div><button class="btn full" id="go">Créer l’école</button>`;
  $("go").onclick=async()=>{
    const n=$("s1").value.trim(),d=$("s2").value.trim(),t=$("s3").value,p=$("s4").value,e=$("ae");e.textContent="";
    if(!n||!d){e.textContent="Écrivez le nom de l’école et le nom de la direction.";return}
    if(t.replace(/\D/g,"").length<8){e.textContent="Entrez un numéro de téléphone valide.";return}
    if(p.length<6){e.textContent="Le mot de passe doit avoir au moins 6 caractères.";return}
    $("go").disabled=true;setting=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,email(t),p);
      const b=writeBatch(db);
      b.set(doc(db,"users",c.user.uid),{nom:d,role:"direction",actif:true,identifiant:t});
      b.set(doc(db,"config","ecole"),{nom:n,annee:"2026-2027",niveaux:LV,cree:serverTimestamp()});
      await b.commit();
      school={nom:n,annee:"2026-2027",niveaux:LV};setting=false;boot(c.user);
    }catch(x){setting=false;$("go").disabled=false;e.textContent=frErr(x)}
  };
}

async function boot(u){
  let s;
  try{s=await getDoc(doc(db,"users",u.uid))}catch(e){await signOut(auth);showAuth(frErr(e));return}
  if(!s.exists()||s.data().actif===false){const m=s.exists()?"Ce compte est désactivé. Contactez la direction.":"Ce compte n’a pas de profil. Contactez la direction.";await signOut(auth);showAuth(m);return}
  me={uid:u.uid,...s.data()};
  if(!school){const c=await getDoc(doc(db,"config","ecole"));school=c.exists()?c.data():{nom:"École",niveaux:LV}}
  unsub.forEach(f=>f());unsub=[];
  if(me.role!="parent")unsub.push(onSnapshot(collection(db,"students"),q=>{students=q.docs.map(d=>({id:d.id,...d.data()}));if(view=="tb"||view=="el")go(view)},()=>{}));
  if(me.role=="direction")unsub.push(onSnapshot(collection(db,"users"),q=>{users=q.docs.map(d=>({id:d.id,...d.data()}));if(view=="pe")go("pe")},()=>{}));
  $("boot").hidden=true;$("auth").hidden=true;$("app").hidden=false;
  $("sn").textContent=school.nom;$("me").textContent=me.nom+" – "+({direction:"Direction",enseignant:"Enseignant",parent:"Parent ou élève"}[me.role]||"");
  const nav=me.role=="parent"?[["me","🎓","Mon enfant"]]:me.role=="enseignant"?[["tb","📊","Tableau de bord"],["el","🎓","Élèves"]]:[["tb","📊","Tableau de bord"],["el","🎓","Élèves"],["pe","👥","Personnel"]];
  $("nav").innerHTML=nav.map(n=>`<a href="#" data-v="${n[0]}">${n[1]} ${n[2]}</a>`).join("");
  go(me.role=="parent"?"me":"tb");
}
$("nav").onclick=e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();$("side").classList.remove("open");go(a.dataset.v)};
$("out").onclick=()=>signOut(auth);

/* ---------- vues ---------- */
const V={};let qs="",lf="";
function go(v){view=v;armed="";document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==v));V[v]()}
const head=(t,btn)=>`<button class="btn sec burger" id="bg" aria-label="Menu">☰ Menu</button><div class="top"><h2>${t}</h2>${btn||""}</div>`;
const bindBurger=()=>{const b=$("bg");if(b)b.onclick=()=>$("side").classList.toggle("open")};

V.tb=()=>{
  const g=students.filter(s=>s.sx=="Garçon").length,f=students.filter(s=>s.sx=="Fille").length;
  const lv=school.niveaux||LV,cnt=lv.map(l=>[l,students.filter(s=>s.niveau==l&&s.sx=="Garçon").length,students.filter(s=>s.niveau==l&&s.sx=="Fille").length]);
  const mx=Math.max(1,...cnt.map(c=>c[1]+c[2]));
  $("main").innerHTML=head("Bonjour "+esc(me.nom),me.role=="direction"?'<button class="btn" data-a="new">+ Nouvel élève</button>':"")+
  `<div class="sm" style="margin:-12px 0 16px">${esc(school.nom)} – Année scolaire ${esc(school.annee||"")}</div>
  <div class="cards"><div class="k"><span>Élèves inscrits</span><b>${students.length}</b><span>${f} filles – ${g} garçons</span></div><div class="k"><span>Garçons</span><b>${g}</b></div><div class="k"><span>Filles</span><b>${f}</b></div><div class="k"><span>Personnel</span><b>${me.role=="direction"?users.filter(u=>u.role!="parent").length:"–"}</b></div></div>
  <div class="panel"><h3>Effectifs par niveau</h3><div class="legend"><span><i style="background:var(--boys)"></i>Garçons</span><span><i style="background:var(--girls)"></i>Filles</span></div>
  ${cnt.map(c=>{const t=c[1]+c[2];return `<div class="row"><div class="t">${esc(c[0])}</div><div class="bar" style="width:${t?Math.max(4,t/mx*100):0}%"><span class="g" style="width:${t?c[1]/t*100:0}%"></span><span class="f" style="width:${t?c[2]/t*100:0}%"></span></div><div>${t}</div></div>`}).join("")}</div>`;
  bindBurger();
};

V.el=()=>{
  const dir=me.role=="direction";
  $("main").innerHTML=head("Élèves",dir?'<button class="btn" data-a="new">+ Nouvel élève</button>':"")+
  `<div class="tools"><input id="q" type="search" placeholder="Chercher un nom ou un matricule" value="${esc(qs)}" aria-label="Chercher"><select id="lv" aria-label="Niveau"><option value="">Tous les niveaux</option>${(school.niveaux||LV).map(l=>`<option${l==lf?" selected":""}>${l}</option>`).join("")}</select></div><p class="sm" id="ct"></p><div class="list" id="lst"></div>`;
  $("q").oninput=e=>{qs=e.target.value;lst()};$("lv").onchange=e=>{lf=e.target.value;lst()};
  bindBurger();lst();
};
function lst(){
  const dir=me.role=="direction",q=qs.trim().toLowerCase();
  const l=students.filter(s=>(!lf||s.niveau==lf)&&(!q||(s.nom+" "+s.pre+" "+s.matricule).toLowerCase().includes(q))).sort((a,b)=>(a.nom+a.pre).localeCompare(b.nom+b.pre));
  $("ct").textContent=l.length+" élève"+(l.length>1?"s":"")+" sur "+students.length;
  $("lst").innerHTML=l.length?l.map(s=>`<div class="it"><div><b>${esc(s.pre+" "+s.nom)}</b><span class="sm">${esc(s.matricule)} – ${esc(s.sx)}</span></div><div>${esc(s.niveau)}<br><span class="sm">Né(e) le ${esc((s.dn||"").split("-").reverse().join("/"))}</span></div><div class="sm">${esc(s.pn||"")}<br>${esc(s.pt||"")}</div>${dir?`<div class="acts"><button class="btn sec" data-a="code" data-id="${s.id}">Code</button><button class="btn del" data-a="del" data-id="${s.id}">${armed==s.id?"Confirmer":"Supprimer"}</button></div>`:"<span></span>"}</div>`).join(""):'<div class="empty">Aucun élève. '+(dir?"Touchez « Nouvel élève » pour en ajouter.":"")+"</div>";
}

V.pe=()=>{
  const l=users.filter(u=>u.role!="parent").sort((a,b)=>a.nom.localeCompare(b.nom));
  $("main").innerHTML=head("Personnel",'<button class="btn" data-a="staff">+ Nouveau compte</button>')+
  `<div class="list">${l.map(u=>`<div class="it"><div><b>${esc(u.nom)}</b><span class="sm">${u.role=="direction"?"Direction":"Enseignant"}</span></div><div>${esc(u.identifiant||"")}</div><div class="sm">${u.actif===false?"Désactivé":"Actif"}</div><div class="acts"><button class="btn sec" data-a="code" data-id="${u.id}" data-u="1">Mot de passe</button>${u.id==me.uid?"":`<button class="btn sec" data-a="tog" data-id="${u.id}">${u.actif===false?"Activer":"Désactiver"}</button>`}</div></div>`).join("")||'<div class="empty">Aucun compte.</div>'}</div>`;
  bindBurger();
};

V.me=async()=>{
  $("main").innerHTML=head("Mon enfant")+'<div class="panel">Chargement…</div>';bindBurger();
  try{
    const s=await getDoc(doc(db,"students",me.eleveId));
    if(!s.exists()){$("main").innerHTML=head("Mon enfant")+'<div class="panel">Fiche introuvable. Contactez la direction.</div>';bindBurger();return}
    const d=s.data(),r=(a,b)=>`<div class="row" style="grid-template-columns:160px 1fr"><div class="t" style="text-align:left">${a}</div><div>${esc(b||"–")}</div></div>`;
    $("main").innerHTML=head(esc(d.pre+" "+d.nom))+`<div class="panel">${r("Matricule",d.matricule)}${r("Classe",d.niveau)}${r("Sexe",d.sx)}${r("Date de naissance",(d.dn||"").split("-").reverse().join("/"))}${r("Lieu de naissance",d.ln)}${r("Adresse",d.ad)}${r("Ancienne école",d.ec)}${r("Parent ou tuteur",d.pn)}${r("Téléphone du parent",d.pt)}</div><p class="sm">Les notes, les absences et les frais seront ajoutés prochainement.</p>`;
    bindBurger();
  }catch(e){$("main").innerHTML=head("Mon enfant")+'<div class="panel">'+esc(frErr(e))+"</div>";bindBurger()}
};

/* ---------- actions ---------- */
function modal(h){$("dl").innerHTML=h;if(!$("dlg").open)$("dlg").showModal()}
const closeM=()=>$("dlg").close();
$("main").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a=="new")return formEl();
  if(a=="staff")return formStaff();
  if(a=="code"){
    try{const c=await getDoc(doc(db,"codes",id));const who=b.dataset.u?users.find(u=>u.id==id):students.find(s=>s.id==id);
      modal(`<h2>${b.dataset.u?"Mot de passe":"Code d’accès"}</h2><div class="cred">${b.dataset.u?"Identifiant : ":"Matricule : "}<b>${esc(b.dataset.u?(who&&who.identifiant):(who&&who.matricule))}</b><br>${b.dataset.u?"Mot de passe":"Code"} : <b>${c.exists()?esc(c.data().code):"non conservé"}</b></div><div class="dacts"><button class="btn" id="x">Fermer</button></div>`);$("x").onclick=closeM}
    catch(x){toast(frErr(x))}return}
  if(a=="del"){
    if(armed!=id){armed=id;return lst()}
    try{const s=students.find(x=>x.id==id),w=writeBatch(db);w.delete(doc(db,"students",id));w.delete(doc(db,"codes",id));if(s&&s.uid)w.delete(doc(db,"users",s.uid));await w.commit();armed="";toast("Élève supprimé")}catch(x){toast(frErr(x))}return}
  if(a=="tog"){const u=users.find(x=>x.id==id);try{await updateDoc(doc(db,"users",id),{actif:u.actif===false});toast(u.actif===false?"Compte activé":"Compte désactivé")}catch(x){toast(frErr(x))}}
};

function formEl(){
  modal(`<h2>Nouvel élève</h2><div class="g2">
  <div><label for="f1">Nom</label><input id="f1"></div><div><label for="f2">Prénom</label><input id="f2"></div>
  <div><label for="f3">Sexe</label><select id="f3"><option value="">Choisir</option><option>Garçon</option><option>Fille</option></select></div><div><label for="f4">Classe</label><select id="f4"><option value="">Choisir</option>${(school.niveaux||LV).map(l=>`<option>${l}</option>`).join("")}</select></div>
  <div><label for="f5">Date de naissance</label><input id="f5" type="date"></div><div><label for="f6">Lieu de naissance</label><input id="f6"></div>
  <div class="w"><label for="f7">Adresse</label><input id="f7"></div><div class="w"><label for="f8">Ancienne école fréquentée</label><input id="f8"></div>
  <div><label for="f9">Nom du parent ou tuteur</label><input id="f9"></div><div><label for="f10">Téléphone du parent</label><input id="f10" type="tel" inputmode="tel"></div></div>
  <div class="err" id="fe" role="alert"></div><div class="dacts"><button class="btn sec" id="c1">Annuler</button><button class="btn" id="s1">Enregistrer</button></div>`);
  $("c1").onclick=closeM;
  $("s1").onclick=async()=>{
    const v=i=>$(i).value.trim(),e=$("fe");e.textContent="";
    if(!v("f1")||!v("f2")||!v("f3")||!v("f4")||!v("f5")){e.textContent="Remplissez le nom, le prénom, le sexe, la classe et la date de naissance.";return}
    if(v("f5")>new Date().toISOString().slice(0,10)){e.textContent="La date de naissance ne peut pas être dans le futur.";return}
    $("s1").disabled=true;
    try{
      const n=await runTransaction(db,async t=>{const r=doc(db,"config","compteur"),s=await t.get(r),k=(s.exists()?s.data().n:0)+1;t.set(r,{n:k});return k});
      const mat="WSF-"+String(school.annee||"2026").slice(0,4)+"-"+String(n).padStart(4,"0"),code=genCode();
      const uid=await mkUser(email(mat,true),code),ref=doc(collection(db,"students")),w=writeBatch(db);
      w.set(ref,{matricule:mat,nom:v("f1"),pre:v("f2"),sx:v("f3"),niveau:v("f4"),dn:v("f5"),ln:v("f6"),ad:v("f7"),ec:v("f8"),pn:v("f9"),pt:v("f10"),uid,cree:serverTimestamp()});
      w.set(doc(db,"users",uid),{nom:v("f9")||v("f2")+" "+v("f1"),role:"parent",eleveId:ref.id,actif:true,identifiant:mat});
      w.set(doc(db,"codes",ref.id),{code});
      await w.commit();
      modal(`<h2>Élève inscrit</h2><p>${esc(v("f2")+" "+v("f1"))} est inscrit(e). Remettez ces informations au parent :</p><div class="cred">Matricule : <b>${mat}</b><br>Code : <b>${code}</b></div><p class="sm">Vous pourrez revoir le code avec le bouton « Code » de la liste des élèves.</p><div class="dacts"><button class="btn" id="x">Fermer</button></div>`);$("x").onclick=closeM;
    }catch(x){$("s1").disabled=false;e.textContent=frErr(x)}
  };
}

function formStaff(){
  modal(`<h2>Nouveau compte du personnel</h2><label for="p1">Nom complet</label><input id="p1"><label for="p2">Rôle</label><select id="p2"><option value="enseignant">Enseignant</option><option value="direction">Direction</option></select><label for="p3">Numéro de téléphone (identifiant)</label><input id="p3" type="tel" inputmode="tel" placeholder="620 00 00 00"><div class="sm" style="margin-top:8px">Un mot de passe temporaire sera créé et affiché une seule fois.</div><div class="err" id="fe" role="alert"></div><div class="dacts"><button class="btn sec" id="c1">Annuler</button><button class="btn" id="s1">Créer le compte</button></div>`);
  $("c1").onclick=closeM;
  $("s1").onclick=async()=>{
    const n=$("p1").value.trim(),t=$("p3").value,e=$("fe");e.textContent="";
    if(!n){e.textContent="Écrivez le nom complet.";return}
    if(t.replace(/\D/g,"").length<8){e.textContent="Entrez un numéro de téléphone valide.";return}
    $("s1").disabled=true;
    try{
      const p=genPw(),uid=await mkUser(email(t),p),w=writeBatch(db);
      w.set(doc(db,"users",uid),{nom:n,role:$("p2").value,actif:true,identifiant:t});w.set(doc(db,"codes",uid),{code:p});await w.commit();
      modal(`<h2>Compte créé</h2><div class="cred">Identifiant : <b>${esc(t)}</b><br>Mot de passe : <b>${p}</b></div><p class="sm">Remettez ces informations à ${esc(n)}.</p><div class="dacts"><button class="btn" id="x">Fermer</button></div>`);$("x").onclick=closeM;
    }catch(x){$("s1").disabled=false;e.textContent=frErr(x)}
  };
}
start();
</script>
